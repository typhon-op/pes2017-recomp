name: Debug APK

# A plain debug apk, signed with the debug key, for putting on a phone.
#
# Separate from android.yml on purpose: that one builds a *release* apk, insists
# on the four production signing secrets, and verifies the permanent certificate
# -- none of which a build for testing should need. Nothing here touches a
# release, a tag or the store.
#
# Triggers, and why they look like this:
#
#   * the feature branch is named first and exactly, then the pattern covers the
#     rest of them. A branch filter is fnmatch-like: `*` stops at a slash and
#     `**` crosses it, so `freebuff/**` does match `freebuff/<anything>`, but an
#     exact entry costs nothing and removes the question.
#   * `workflow_dispatch` is listed for running it by hand. Note that GitHub's
#     "Run workflow" picker lists the workflows defined on the repository's
#     *default* branch: until this file is also on that branch it can still be
#     started by a push (as here) but it will not be offered in the picker.
#   * nothing in this file can make a push start a run if the push itself was
#     made with a token GitHub suppresses runs for, or if Actions are turned off
#     for the repository. Both are repository settings, not workflow settings;
#     the first step below prints the ref and sha so a missing run on the
#     Actions tab can be told apart from a forgotten push.
on:
  push:
    branches:
      - 'freebuff/938b1b2d294d57d7251b2bb3'
      - 'freebuff/**'
  workflow_dispatch:

permissions:
  contents: read

# The engine this apk is packaged with. It cannot be built from this tree: the
# recompiled title is made from the disc's executables, which are in no
# repository, so the build packages a libpes17.so built elsewhere.
#
# A fork that HAS built one from these sources can point these two at its own
# release asset (Settings > Secrets and variables > Actions > Variables, named
# PES17_ENGINE_URL and PES17_ENGINE_SHA256) and every entry point the app calls
# is in the apk again. The audit step below prints which ones are, either way.
env:
  ENGINE_URL: "${{ vars.PES17_ENGINE_URL || 'https://github.com/dzakyraf/pes2017-recomp/releases/download/0.2.0/pes2017-recomp-0.2.0.apk' }}"
  ENGINE_SHA256: "${{ vars.PES17_ENGINE_SHA256 || '843e276c2f86adc6057c0ed5288ab64110195342ac6bbeec1e6ce663b83ce1d6' }}"

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: What is being built
        run: |
          echo "ref:  $GITHUB_REF"
          echo "sha:  $GITHUB_SHA"
          echo "actor: $GITHUB_ACTOR"
          echo "event: $GITHUB_EVENT_NAME"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # The app cannot be built from this tree alone: the recompiled guest code
      # is made from the disc's executables and is in no repository, so there is
      # nothing here to compile libpes17.so from. The release workflow packages
      # the published engine for the same reason, and this one does exactly the
      # same thing -- which also means an apk built here carries that engine, not
      # one built from these sources.
      #
      # ENGINE_URL / ENGINE_SHA256 come from the variables at the top of this
      # file: the published engine unless a fork has built a matching one.
      - name: Fetch the native engine
        run: |
          echo "engine: $ENGINE_URL"
          mkdir -p "$GITHUB_WORKSPACE/libpes17_prebuilt/arm64-v8a"
          curl -sL --retry 3 -o /tmp/upstream.apk "$ENGINE_URL"
          if [ ! -f /tmp/upstream.apk ]; then
            echo "ERROR: could not download the apk with the native engine."
            exit 1
          fi
          echo "$ENGINE_SHA256  /tmp/upstream.apk" \
            | sha256sum -c - || { echo "ERROR: engine checksum mismatch!"; exit 1; }
          unzip -j /tmp/upstream.apk "lib/arm64-v8a/*" -d "$GITHUB_WORKSPACE/libpes17_prebuilt/arm64-v8a/"
          ls -lh "$GITHUB_WORKSPACE/libpes17_prebuilt/arm64-v8a/"

      # Which of the app's entry points this engine has. An engine from before
      # one existed does not export it, and the app asks before calling it, so
      # the cost is that feature and not the whole app -- but which features
      # those are belongs in the log, not in how the controls feel.
      - name: Audit the engine's entry points
        run: |
          ./tools/engine_symbols.sh \
            "$GITHUB_WORKSPACE/libpes17_prebuilt/arm64-v8a/libpes17.so"

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          PREBUILT="$GITHUB_WORKSPACE/libpes17_prebuilt"
          echo "Building debug apk with prebuiltNative=$PREBUILT"
          ./gradlew :app:assembleDebug -PprebuiltNative="$PREBUILT" --stacktrace

      - name: Check the APK carries the engine
        run: |
          APK=$(ls "$GITHUB_WORKSPACE"/android/app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $APK"
          ls -lh "$APK"
          unzip -l "$APK" | grep "lib/arm64-v8a/libpes17.so" \
            || { echo "ERROR: libpes17.so missing from the apk -- it would install and die on launch."; exit 1; }

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pes2017-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
