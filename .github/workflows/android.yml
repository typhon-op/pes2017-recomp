name: Build and Release Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Fetch Prebuilt Native Library
        run: |
          yes | sdkmanager --licenses || true
          mkdir -p libpes17_prebuilt/arm64-v8a
          # Download official release native engine components if available
          curl -sL -o /tmp/upstream.apk "https://github.com/dzakyraf/pes2017-recomp/releases/download/0.2.0/pes2017-recomp-0.2.0.apk" || true
          if [ -f /tmp/upstream.apk ] && unzip -t /tmp/upstream.apk "lib/arm64-v8a/libpes17.so" >/dev/null 2>&1; then
            unzip -j /tmp/upstream.apk "lib/arm64-v8a/*" -d libpes17_prebuilt/arm64-v8a/
            echo "Successfully unpacked full native engine into libpes17_prebuilt/arm64-v8a/"
          fi

      - name: Build Release APK
        run: |
          chmod +x android/gradlew
          cd android
          if [ -d "../libpes17_prebuilt/arm64-v8a" ] && [ -f "../libpes17_prebuilt/arm64-v8a/libpes17.so" ]; then
            ./gradlew :app:assembleRelease -PprebuiltNative=../libpes17_prebuilt
          else
            ./gradlew :app:assembleRelease
          fi

      - name: Verify APK Contents
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "Verifying APK: $APK"
          ls -lh "$APK"
          unzip -l "$APK" | grep "lib/arm64-v8a/libpes17.so" || { echo "ERROR: libpes17.so missing from APK!"; exit 1; }

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pes2017-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
